[build]
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.4.1"

# Root → default locale. Belt-and-braces for when middleware
# doesn't run on the bare path at the edge.
[[redirects]]
  from = "/"
  to = "/en"
  status = 308

[[plugins]]
  package = "@netlify/plugin-nextjs"
