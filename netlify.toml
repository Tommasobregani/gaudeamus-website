[build]
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.4.1"

# Root → default locale. Belt-and-braces for when middleware
# doesn't run on the bare path at the edge.
[[redirects]]
  from = "/"
  to = "/en"
  status = 308

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Make sure HTML pages are revalidated on every deploy — without this,
# Netlify's Durable cache can serve stale HTML referencing pre-deploy
# asset hashes for hours after a deploy.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=60, must-revalidate"
